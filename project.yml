name: ShopWithMe
options:
  bundleIdPrefix: com.made4me
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "50"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ShopWithMe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMe
    info:
      path: ShopWithMe/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ShopWithMe
        NSCameraUsageDescription: "Wird benötigt, um Kassenbons und Preisschilder für die Preishistorie zu fotografieren."
        NSLocationWhenInUseUsageDescription: "Wird benötigt, um beim Einkaufen automatisch das passende Geschäft in der Nähe vorzuschlagen."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.made4me.ShopWithMe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CBYLYH36PT

  ShopWithMeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMeTests
    dependencies:
      - target: ShopWithMe
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CBYLYH36PT
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ShopWithMe:
    build:
      targets:
        ShopWithMe: all
        ShopWithMeTests: [test]
    test:
      targets:
        - ShopWithMeTests
    run:
      config: Debug
