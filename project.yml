name: ShopWithMe
options:
  bundleIdPrefix: com.made4me
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

fileGroups:
  - README.md
  - docs

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.14"
    CURRENT_PROJECT_VERSION: "252"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ShopWithMe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMe
    info:
      path: ShopWithMe/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ShopWithMe
        NSCameraUsageDescription: "Wird benötigt, um Kassenbons und Preisschilder für die Preishistorie zu fotografieren."
        NSLocationWhenInUseUsageDescription: "Wird benötigt, um beim Einkaufen automatisch das passende Geschäft in der Nähe vorzuschlagen."
        NSLocalNetworkUsageDescription: "Wird benötigt, um Änderungen an der Einkaufsliste beim gemeinsamen Einkaufen sofort mit Geräten in der Nähe abzugleichen."
        NSBonjourServices:
          - _swm-sync._tcp
          - _swm-sync._udp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.made4me.ShopWithMe
            CFBundleURLSchemes:
              - shopwithme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.made4me.ShopWithMe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CBYLYH36PT
    entitlements:
      path: ShopWithMe/ShopWithMe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.made4me.ShopWithMe
    dependencies:
      - target: ShopWithMeShareExtension
        embed: true

  ShopWithMeShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMeShareExtension
      - path: ShopWithMe/Services/MilkForUsPendingImportStore.swift
    info:
      path: ShopWithMeShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ShopWithMe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.made4me.ShopWithMe.ShareExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CBYLYH36PT
        SKIP_INSTALL: YES
    entitlements:
      path: ShopWithMeShareExtension/ShopWithMeShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.made4me.ShopWithMe

  ShopWithMeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMeTests
    dependencies:
      - target: ShopWithMe
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CBYLYH36PT
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ShopWithMe:
    build:
      targets:
        ShopWithMe: all
        ShopWithMeTests: [test]
    test:
      targets:
        - ShopWithMeTests
    run:
      config: Debug
