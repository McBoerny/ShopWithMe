name: ShopWithMe
options:
  bundleIdPrefix: com.made4me
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Kein Team hinterlegt -> nur Simulator-Builds ohne Code-Signing.
    # Für Geräte-Builds CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM in Xcode setzen.
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  ShopWithMe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.made4me.ShopWithMe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ShopWithMe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ShopWithMeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShopWithMeTests
    dependencies:
      - target: ShopWithMe

schemes:
  ShopWithMe:
    build:
      targets:
        ShopWithMe: all
        ShopWithMeTests: [test]
    test:
      targets:
        - ShopWithMeTests
    run:
      config: Debug
